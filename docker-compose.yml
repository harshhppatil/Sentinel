version: '3.9'

services:

  # ── MongoDB ─────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: sentinel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - sentinel-network
    environment:
      MONGO_INITDB_DATABASE: sentineldb

  # ── Auth Service (Node.js/Express) ──────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: sentinel-auth
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/sentineldb
      JWT_SECRET: your_super_secret_jwt_key_change_this
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:80
    depends_on:
      - mongodb
    networks:
      - sentinel-network

  # ── Core Service (Spring Boot) ───────────────────────────────────
  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: sentinel-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/sentineldb
      SERVER_PORT: 8080
    depends_on:
      - mongodb
    networks:
      - sentinel-network

  # ── Frontend (React + Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - core-service
    networks:
      - sentinel-network

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  mongo-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────
networks:
  sentinel-network:
    driver: bridge